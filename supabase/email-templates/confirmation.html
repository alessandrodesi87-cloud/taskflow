<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conferma il tuo account Cronovia</title>
  </head>
  <body style="margin:0;background-color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f1f5f9">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background-color:#ffffff;border-radius:16px">
            <tr>
              <td style="padding:28px 32px;background-color:#0b2f57;border-radius:16px 16px 0 0">
                <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:28px;font-weight:700;letter-spacing:4px;color:#d5b55b">CRONOVIA</p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:26px;line-height:34px;color:#0b2f57">Conferma il tuo account</h1>
                <p style="margin:18px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:25px;color:#475569">Grazie per esserti registrato. Conferma il tuo indirizzo email per iniziare a usare Cronovia.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:26px">
                  <tr>
                    <td bgcolor="#0b2f57" style="background-color:#0b2f57;border-radius:9px">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 20px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:700;color:#ffffff;text-decoration:none">Conferma il mio account</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#94a3b8">Se non hai richiesto tu la registrazione, puoi ignorare questa email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
